name: Run Multi-Strategy Research System

on:
  repository_dispatch:
    types: [cron_trigger]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ay-research-live
  cancel-in-progress: true

jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 600

    env:
      K01: ${{ secrets.K01 }}
      K02: ${{ secrets.K02 }}
      K03: ${{ secrets.K03 }}
      K04: ${{ secrets.K04 }}
      K05: ${{ secrets.K05 }}
      K06: ${{ secrets.K06 }}
      K07: ${{ secrets.K07 }}
      K08: ${{ secrets.K08 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile q.py

      - name: Self test
        run: python q.py --self-test

      - name: Run system
        run: python -u q.py
